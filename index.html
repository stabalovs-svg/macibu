<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">

<title>GoDrive – Mācību materiāli</title>
<style>
/* Brand tokens: placeholders, replace with the school's official values */
:root{--brand:#12355b;--brand-ink:#fff;--sig:#ffc233;--bg:#f3f5f7;--ink:#14212e;--mute:#5a6876;--card:#fff;--line:#d5dce3;--road:#4a5056;--walk:#c9c5b8;--mark:#e9e6d6;--acc:#ffc233;--p1:#7d8b99;--p2:#9a8478;--me:#2f7fd1;
--f:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--brand:#0b2239;--bg:#10161c;--ink:#e8edf1;--mute:#9aa6b1;--card:#1a232c;--line:#2f3b46;--road:#2c3136;--walk:#5a574d;--mark:#c9c6b6;--me:#4a96e8}}
:root[data-theme="dark"]{--brand:#0b2239;--bg:#10161c;--ink:#e8edf1;--mute:#9aa6b1;--card:#1a232c;--line:#2f3b46;--road:#2c3136;--walk:#5a574d;--mark:#c9c6b6;--me:#4a96e8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f)}
a{color:inherit}
header{background:var(--brand);color:var(--brand-ink);border-bottom:4px solid var(--sig)}
.hd{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.35rem;text-decoration:none}
.logo i{display:inline-block;width:26px;height:14px;background:var(--sig);border-radius:4px;position:relative}
.logo i:after{content:"";position:absolute;right:3px;top:3px;width:6px;height:8px;background:var(--brand);border-radius:1px}
nav{display:flex;gap:4px;margin-left:auto;align-items:center}
nav a,nav button{color:var(--brand-ink);text-decoration:none;padding:8px 12px;border-radius:6px;font:inherit;background:none;border:1px solid transparent;cursor:pointer;min-height:40px}
nav a:hover,nav button:hover{background:rgba(255,255,255,.14)}
nav a.on{border-color:var(--sig)}
nav button{border-color:rgba(255,255,255,.4)}
:focus-visible{outline:3px solid var(--sig);outline-offset:2px}
main{max-width:1080px;margin:0 auto;padding:22px 16px 40px}
h1{font-size:1.9rem;line-height:1.2;margin:0 0 8px}
.lead{color:var(--mute);max-width:60ch;margin:0 0 22px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--sig);border-radius:8px;padding:18px;text-decoration:none}
.card h2{margin:0 0 6px;font-size:1.2rem}
.card p{margin:0 0 12px;color:var(--mute)}
.btn{display:inline-block;background:var(--sig);color:#14212e;padding:10px 16px;border-radius:6px;font-weight:600;min-height:20px}
.sub{color:var(--mute);margin:0 0 14px}
.lay{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
svg{width:100%;height:auto;max-height:78vh;display:block;border-radius:8px;border:1px solid var(--line)}
#tip{margin:0 0 10px;padding:10px 12px;border-left:4px solid var(--sig);background:var(--card);border-radius:0 8px 8px 0;min-height:4.4em;font-size:.95rem}
.bar{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;margin-bottom:10px}
.bar button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:44px;cursor:pointer}
.bar button.p{background:var(--sig);border-color:var(--sig);color:#14212e;font-weight:700}
ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li button{width:100%;text-align:left;display:block;padding:9px 12px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;cursor:pointer;min-height:44px}
li b{display:block}li span{color:var(--mute);font-size:.85rem;line-height:1.35;display:block}
li.on button{border-color:var(--sig);box-shadow:inset 0 0 0 2px var(--sig)}
.hl{paint-order:stroke;stroke:#000;stroke-opacity:.65;stroke-width:3px}
footer{border-top:1px solid var(--line);color:var(--mute);font-size:.88rem}
footer div{max-width:1080px;margin:0 auto;padding:16px;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
[hidden]{display:none!important}
@media (max-width:760px){.lay{grid-template-columns:1fr}svg{max-height:64vh}h1{font-size:1.5rem}nav{margin-left:0;width:100%;justify-content:space-between}nav a,nav button{padding:8px 8px}}
</style>
</head>

</section>
</main>
